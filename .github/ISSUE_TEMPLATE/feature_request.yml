name: Feature request
description: Suggest a new tool or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do in Cavalry?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed tool or behaviour
      description: Mention the Cavalry API functions involved if you know them.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
